<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Background Overlay -->
<div class="editorial-overlay" data-alt="A sophisticated editorial background featuring an abstract composition of vintage Angolan currency, archival maps, and architectural sketches. The image is rendered in high-contrast monochrome with deep bordeaux undertones, suggesting a rich historical and economic narrative. Soft cinematic lighting and a shallow depth of field create a professional, academic atmosphere suitable for a premium journal."></div>
<!-- Login Card Container -->
<main class="w-full max-w-[480px] px-stack-md z-10">
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] p-stack-xl flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-stack-lg flex flex-col items-center gap-stack-sm">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="account_balance">account_balance</span>
<div class="text-center">
<h1 class="font-headline-sm text-headline-sm text-primary tracking-tight font-bold">Economia com História</h1>
<p class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Angola</p>
</div>
</div>
<!-- Header -->
<div class="text-center mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">Aceda à sua conta</h2>
<p class="font-body-md text-body-md text-secondary mt-stack-sm">Aceda à sua conta para continuar a ler.</p>
</div>
<!-- Form -->
<form class="w-full space-y-stack-md">
<!-- Email Input -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary text-[20px]" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md transition-all" id="email" name="email" placeholder="nome@exemplo.com" type="email">
</div>
</div>
<!-- Password Input -->
<div class="space-y-stack-sm">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Palavra-passe</label>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary text-[20px]" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md transition-all" id="password" name="password" placeholder="••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-secondary hover:text-primary" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between py-stack-sm">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer" type="checkbox">
<span class="font-label-md text-label-md text-secondary group-hover:text-on-surface transition-colors">Lembrar-me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:underline font-bold transition-all" href="#">Esqueceu a senha?</a>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-[0.98] shadow-sm" type="submit">
                    Entrar
                </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-4 my-stack-lg">
<div class="h-[1px] flex-grow bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">ou aceder com</span>
<div class="h-[1px] flex-grow bg-outline-variant"></div>
</div>
<!-- Social/Secondary -->
<div class="w-full flex gap-4 mb-stack-lg">
<button class="flex-1 flex items-center justify-center gap-2 py-3 border border-outline-variant rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container-high transition-colors">
<img alt="Google" class="w-4 h-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAtaqazriznAS86KCDb9MTp9E13ADlpWf-WDz_xfxJAQdAfSV1Xec704dV978FVmrlE9okYtvpnY_KXYUQ78_VirGyVzxDpRnxPBsH7S8A4RDoO5Y7h_ADken3d_1XIqCNXy_CVRipLBPDcB2utC96sH5TOAgz6iuWL9rMJtcPqsiCFBrtch3_KWRpC2iTFLYUQs6wHdKnzxWyk7p91wBlyf5H4AcUdUn58KbNhCdoS2AIeqwVuV7_Zj7lL01tOX_pqHdicA64qByB">
                    Google
                </button>
<button class="flex-1 flex items-center justify-center gap-2 py-3 border border-outline-variant rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="terminal">terminal</span>
                    LinkedIn
                </button>
</div>
<!-- Footer Action -->
<div class="text-center pt-stack-md border-t border-outline-variant w-full">
<p class="font-body-md text-body-md text-secondary">
                    Não tem conta? 
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Criar conta grátis</a>
</p>
</div>
</div>
<!-- System Footer Links -->
<div class="mt-stack-lg flex justify-center gap-stack-lg">
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="#">Sobre</a>
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="#">Termos</a>
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="#">Privacidade</a>
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="#">Contacto</a>
</div>
</main>
<!-- Visual Accents (Optional Editorial Flair) -->
<div class="hidden lg:block absolute bottom-margin-desktop left-margin-desktop opacity-40">
<p class="font-body-md text-body-md text-secondary italic max-w-xs">
            "A economia é a base, a história é a narrativa."
        </p>
</div>
