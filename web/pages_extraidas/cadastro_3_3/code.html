<!DOCTYPE html>

<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fcf9f8; /* Bone Background */
        }
    </style>

          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary": "#5d5f5d",

                      "secondary-fixed-dim": "#c6c7c5",
                      "on-tertiary-fixed": "#1a1c1c",
                      "secondary-container": "#e2e3e1",
                      "on-tertiary-container": "#b5b5b6",

                      "tertiary-container": "#454748",

                      "on-secondary": "#ffffff",

                      "on-primary": "#ffffff",
                      "outline": "#8c716e",
                      "on-error-container": "#93000a",
                      "inverse-on-surface": "#f3f0ef",
                      "tertiary": "#2f3131",

                      "primary-container": "#8b1a1a",

                      "error": "#ba1a1a",

                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"

              "spacing": {
                      "stack-lg": "32px",
                      "max-content-width": "1160px",
                      "margin-desktop": "40px",
                      "gutter": "24px",
                      "stack-md": "16px",
                      "stack-xl": "64px",
                      "stack-sm": "8px",
                      "sidebar-width": "280px"

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Header Section (Brand Anchor) -->
<header class="w-full flex justify-center py-stack-lg">
<div class="flex flex-col items-center">
<h1 class="font-headline-md text-headline-md font-bold text-primary">Economia com História</h1>
<p class="font-label-md text-label-md text-secondary tracking-widest">ANGOLA</p>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-margin-desktop py-stack-xl">
<!-- Centralized Onboarding Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl w-full max-w-[560px] p-stack-lg shadow-[0px_4px_20px_rgba(0,0,0,0.04)]">
<!-- Progress Indicator -->
<div class="mb-stack-lg">
<div class="flex justify-between items-center mb-stack-sm">
<span class="font-label-md text-label-md text-secondary uppercase tracking-wider">Passo 3 de 3</span>
<span class="font-label-md text-label-md text-primary font-bold">Conclusão</span>
</div>
<div class="h-1 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary w-full"></div>
</div>
</div>
<!-- Content -->
<div class="text-center mb-stack-lg">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-stack-sm">Interesses</h2>
<p class="font-body-md text-body-md text-secondary max-w-[400px] mx-auto">
                    Selecione os temas que mais lhe interessam para personalizarmos o seu arquivo e as sugestões de leitura.
                </p>
</div>
<!-- Multi-select Interest Grid -->
<div class="grid grid-cols-2 gap-stack-md mb-stack-xl">
<!-- Option 1 -->
<button class="flex flex-col items-start p-stack-md border-2 border-primary bg-primary/5 rounded-xl text-left transition-all hover:border-primary">
<div class="flex justify-between w-full mb-stack-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">analytics</span>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-label-md text-label-md text-on-background font-bold">Macroeconomia</span>
</button>
<!-- Option 2 -->
<button class="flex flex-col items-start p-stack-md border border-outline-variant bg-surface-container-lowest rounded-xl text-left transition-all hover:border-primary/50">
<div class="flex justify-between w-full mb-stack-sm">
<span class="material-symbols-outlined text-secondary">history_edu</span>
</div>
<span class="font-label-md text-label-md text-on-background font-bold">História Colonial</span>
</button>
<!-- Option 3 -->
<button class="flex flex-col items-start p-stack-md border-2 border-primary bg-primary/5 rounded-xl text-left transition-all hover:border-primary">
<div class="flex justify-between w-full mb-stack-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-label-md text-label-md text-on-background font-bold">Recursos Naturais</span>
</button>
<!-- Option 4 -->
<button class="flex flex-col items-start p-stack-md border border-outline-variant bg-surface-container-lowest rounded-xl text-left transition-all hover:border-primary/50">
<div class="flex justify-between w-full mb-stack-sm">
<span class="material-symbols-outlined text-secondary">account_balance</span>
</div>
<span class="font-label-md text-label-md text-on-background font-bold">Instituições</span>
</button>
<!-- Option 5 (Additional Contextual Choice) -->
<button class="flex flex-col items-start p-stack-md border border-outline-variant bg-surface-container-lowest rounded-xl text-left transition-all hover:border-primary/50">
<div class="flex justify-between w-full mb-stack-sm">
<span class="material-symbols-outlined text-secondary">agriculture</span>
</div>
<span class="font-label-md text-label-md text-on-background font-bold">Agronegócio</span>
</button>
<!-- Option 6 (Additional Contextual Choice) -->
<button class="flex flex-col items-start p-stack-md border border-outline-variant bg-surface-container-lowest rounded-xl text-left transition-all hover:border-primary/50">
<div class="flex justify-between w-full mb-stack-sm">
<span class="material-symbols-outlined text-secondary">lan</span>
</div>
<span class="font-label-md text-label-md text-on-background font-bold">Infraestrutura</span>
</button>
</div>
<!-- CTA Actions -->
<div class="flex flex-col gap-stack-md">
<button class="w-full bg-primary text-on-primary py-4 rounded-full font-label-md text-label-md font-bold uppercase tracking-widest hover:brightness-110 active:scale-[0.98] transition-all">
                    Finalizar Cadastro
                </button>
<button class="w-full text-secondary py-2 font-label-sm text-label-sm hover:text-primary transition-colors">
                    Pular por agora e decidir depois
                </button>
</div>
</div>
</main>
<!-- Aesthetic Decorative Elements -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-primary/10"></div>
<div class="fixed top-0 right-0 p-margin-desktop opacity-5 select-none pointer-events-none hidden md:block">
<img class="w-96 grayscale" data-alt="A subtle, highly detailed cartographic overlay of a vintage Angolan map from the 19th century. The map features elegant calligraphic labels and intricate topography lines, rendered in a sophisticated monochromatic bone and charcoal aesthetic to match a premium editorial journal style. The lighting is soft and flat, emphasizing the paper-like texture and historical significance of the geography." data-location="Angola" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBs8ePX9C1wKlVNNJVd_Yb3NL2Gi__6PdTkS6KsY8yTmBcPLhNhckodnBJxW--c2hCbe0XUxhgpQa2uJLYAsb4s7wX_Xu802qp0M8vqNfTrBqfj7bkO-CekbvcYXtsd2TkihUe7RoEBSt-bhjTEYmQUXMwo8X4dDGzOdNUygGA8XkiUiKiv6OHUCgvdzvu6Bo8p5dDHXnx4Lc4yjBLTwfw1g-_hF6vC32pFZr3Vdebc7tEGzpF5sU86hQdBzy6epKAB5818Ech1zh5Z"/>
</div>
<!-- Footer Copyright (Derived from Shared Components) -->
<footer class="w-full py-stack-lg border-t border-outline-variant flex justify-center">
<p class="font-label-sm text-label-sm text-secondary">
            © 2024 Economia com História – Angola. Todos os direitos reservados.
        </p>
</footer>
</body></html>
