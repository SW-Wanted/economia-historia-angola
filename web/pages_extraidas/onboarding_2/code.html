<body class="min-h-screen flex items-center justify-center font-body-md text-on-surface">
<!-- Onboarding Container (Maximum width for desktop focus) -->
<main class="w-full max-w-[1000px] flex flex-col items-center justify-center px-margin-desktop py-stack-xl">
<!-- White Content Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] overflow-hidden flex flex-col md:flex-row w-full min-h-[600px]">
<!-- Visual Representation Side (Asymmetric Layout Component) -->
<div class="w-full md:w-1/2 bg-surface-container p-stack-lg flex items-center justify-center relative overflow-hidden">
<!-- Decorative pattern background -->
<div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(#690008 1px, transparent 1px); background-size: 20px 20px;"></div>
<!-- Bento-style grid for diverse content representation -->
<div class="grid grid-cols-2 grid-rows-3 gap-4 w-full h-full max-h-[480px]">
<div class="bg-surface rounded-lg shadow-sm p-4 flex flex-col gap-2 row-span-2">
<div class="w-full h-24 bg-surface-variant rounded-md overflow-hidden">

</div>
<span class="font-label-sm text-label-sm text-primary">MICROTEXTO</span>
<div class="h-2 w-full bg-outline-variant rounded-full"></div>
<div class="h-2 w-2/3 bg-outline-variant rounded-full"></div>
</div>
<div class="bg-surface rounded-lg shadow-sm p-4 flex items-center justify-center relative overflow-hidden row-span-1">
<span class="material-symbols-outlined text-primary text-4xl">play_circle</span>
<img alt="Economic Video" class="absolute inset-0 w-full h-full object-cover opacity-20" data-alt="A cinematic frame of a modern Angolan marketplace showing vibrant economic activity, captured with a documentary-style lens. The scene is bright and airy with high-key lighting, emphasizing the modern editorial edge of the brand. Soft shadows and a clean white overlay create depth, while the primary bordeaux colors are reflected in the market stalls." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC26rMkRF2jSacOmRIdqiudTn9Tql1pG5LW7DA_v5TZEOrvQ5ZdW6KOGy7e_Lk-_Si7JmQDGBj2taiLkVVsQIzSsiR2Q8SJhFTk9e3Mbi-f08r3jnjmRsG4IG0lxi5OwO4AhgtQQqfmllCdODo30Pwmlp-T886iqDCgiX63qFdF8UsYrYfKqodjxLfFohnhyyWphQTDb67oQOOjotflmts8c0lZdMuX3ukYHONJ6VMiu8LXjYg3lFmr24WX8KrfVkEvQ-TnlEMICdGs"/>
</div>
<div class="bg-surface rounded-lg shadow-sm overflow-hidden row-span-2 col-start-2 row-start-2">
<div class="h-full w-full bg-surface-container-high relative">
<img alt="Interactive Map" class="w-full h-full object-cover" data-alt="An elegant, minimalist vector map of Angola showing economic trade routes with fine bordeaux lines and gold-tinted nodes. The background is a clean bone-white, following the Modern Editorial design style. The map is detailed yet organized, allowing for generous whitespace and a premium physical journal feel." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3I867ynMIXwu6qj7KtTUM737HyxzLkjewTrBM4LeeNLuhJwihXAAs3yfiiek4VUIcSKL5M8xiSEfgZuuGGYkVDIDW58R3Lvc6mrJnC97WKhr3IsyW8nYa19eBY8_OMO8lhuxfxj0It95C_5Vq3ZvL9WMMwz8F5E6CSM3uTi0lkazkCDeVyvRH4v1_-_FSSzJY7PIvw8LK5LvzYtR6zhCc7wS_vS2nglI2ftEMT9KpD69ac5g1RcFoTvJERyu5iiTwW44sKaTGbOpn"/>
<div class="absolute inset-0 bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl">location_on</span>
</div>
</div>
</div>
<div class="bg-surface rounded-lg shadow-sm p-4 flex flex-col justify-between row-span-1">
<span class="material-symbols-outlined text-secondary">forum</span>
<div class="space-y-1">
<div class="h-1.5 w-full bg-outline-variant rounded-full"></div>
<div class="h-1.5 w-4/5 bg-outline-variant rounded-full"></div>
</div>
</div>
</div>
</div>
<!-- Content Side -->
<div class="w-full md:w-1/2 p-stack-xl flex flex-col justify-center bg-surface-container-lowest">
<div class="max-w-[400px] mx-auto w-full space-y-stack-lg">
<!-- Heading -->
<h1 class="font-headline-lg text-headline-lg text-primary">
                        Herança Cultural
                    </h1>
<!-- Body Text -->
<p class="font-body-lg text-body-lg text-secondary leading-relaxed">
                        A nossa história como chave do futuro da economia angolana.
                    </p>
<!-- Pagination Dots (Second Active) -->
<div class="flex gap-2 py-stack-md">
<div class="w-2 h-2 rounded-full bg-secondary-fixed-dim"></div>
<div class="w-6 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-secondary-fixed-dim"></div>
</div>
<!-- Navigation Actions -->
<div class="flex items-center gap-gutter pt-stack-md">
<!-- Voltar (Secondary Button) -->
<button class="flex-1 px-stack-md py-4 border border-primary text-primary font-label-md text-label-md rounded-full hover:bg-surface-container transition-colors">
                            Voltar
                        </button>
<!-- Próximo (Primary Button) -->
<button class="flex-1 px-stack-md py-4 bg-primary text-on-primary font-label-md text-label-md rounded-full hover:opacity-90 active:scale-95 transition-all shadow-sm">
                            Próximo
                        </button>
</div>
</div>
</div>
</div>
<!-- Footnote / Brand Mark -->
<footer class="mt-stack-lg flex flex-col items-center gap-stack-sm opacity-60">
<div class="flex items-center gap-2">
<span class="font-headline-sm text-headline-sm font-bold text-primary">Economia com História</span>
</div>
<p class="font-label-sm text-label-sm text-secondary">Angola © 2024</p>
</footer>
</main>
