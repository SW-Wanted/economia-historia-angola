<!DOCTYPE html>

<html lang="pt"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Merriweather:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary": "#5d5f5d",
                      "on-background": "#1c1b1b",
                      "secondary-fixed-dim": "#c6c7c5",
                      "on-tertiary-fixed": "#1a1c1c",
                      "secondary-container": "#e2e3e1",
                      "on-tertiary-container": "#b5b5b6",
                      "on-secondary-fixed-variant": "#454746",
                      "tertiary-container": "#454748",
                      "surface-container": "#f0eded",
                      "on-tertiary-fixed-variant": "#454747",
                      "primary-fixed-dim": "#ffb3ac",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-container": "#636563",
                      "on-secondary": "#ffffff",
                      "inverse-surface": "#313030",
                      "secondary-fixed": "#e2e3e1",
                      "on-primary": "#ffffff",
                      "outline": "#8c716e",
                      "on-error-container": "#93000a",
                      "inverse-on-surface": "#f3f0ef",
                      "tertiary": "#2f3131",
                      "surface-container-low": "#f6f3f2",
                      "surface-bright": "#fcf9f8",
                      "primary-container": "#8b1a1a",
                      "tertiary-fixed": "#e2e2e2",
                      "on-surface-variant": "#58413f",
                      "surface-tint": "#ac322e",
                      "surface": "#fcf9f8",
                      "tertiary-fixed-dim": "#c6c6c7",
                      "error-container": "#ffdad6",
                      "on-primary-fixed-variant": "#8a1a1a",
                      "on-primary-container": "#ff9a91",
                      "on-surface": "#1c1b1b",
                      "primary-fixed": "#ffdad6",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed": "#410003",
                      "outline-variant": "#e0bfbc",
                      "background": "#fcf9f8",
                      "on-error": "#ffffff",
                      "inverse-primary": "#ffb3ac",
                      "on-secondary-fixed": "#1a1c1b",
                      "primary": "#690008",
                      "surface-dim": "#dcd9d9",
                      "error": "#ba1a1a",
                      "surface-container-highest": "#e5e2e1",
                      "surface-container-high": "#eae7e7",
                      "surface-variant": "#e5e2e1"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-lg": "32px",
                      "max-content-width": "1160px",
                      "margin-desktop": "40px",
                      "gutter": "24px",
                      "stack-md": "16px",
                      "stack-xl": "64px",
                      "stack-sm": "8px",
                      "sidebar-width": "280px"
              },
              "fontFamily": {
                      "headline-lg": ["Plus Jakarta Sans"],
                      "body-lg": ["Merriweather"],
                      "headline-lg-mobile": ["Plus Jakarta Sans"],
                      "headline-sm": ["Plus Jakarta Sans"],
                      "body-md": ["Merriweather"],
                      "label-sm": ["Plus Jakarta Sans"],
                      "label-md": ["Plus Jakarta Sans"],
                      "headline-md": ["Plus Jakarta Sans"],
                      "display-lg": ["Plus Jakarta Sans"]
              },
              "fontSize": {
                      "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "body-lg": ["18px", {"lineHeight": "1.8", "fontWeight": "400"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "headline-sm": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "label-sm": ["12px", {"lineHeight": "1.2", "fontWeight": "500"}],
                      "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                      "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}]
              }
            },
          },
        }
    </script>
</head>
<body class="bg-[#F2F2F0] text-on-background font-body-md min-h-screen flex items-center justify-center p-6">
<!-- Main Container -->
<main class="w-full max-w-[480px]">
<!-- Header Branding (Suppressed Nav Shell as per Transactional Rule) -->
<div class="flex flex-col items-center mb-stack-lg text-center">
<div class="mb-stack-md">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="history_edu">history_edu</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Economia com História</h1>
<p class="font-label-md text-label-md text-secondary uppercase tracking-widest mt-1">Angola</p>
</div>
<!-- Central Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] p-margin-desktop border border-outline-variant/30">
<div class="mb-stack-lg">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Recuperar Senha</h2>
<p class="font-body-md text-body-md text-secondary">Introduza o seu e-mail para receber as instruções de recuperação.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-stack-md" method="POST">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary text-[20px]" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all font-body-md text-on-surface placeholder:text-secondary-fixed-dim" id="email" name="email" placeholder="exemplo@email.com" type="email"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-4 rounded-full hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-[0.98] mt-stack-md flex items-center justify-center gap-2" type="submit">
                    Enviar Instruções
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Bottom Link -->
<div class="mt-stack-lg text-center pt-stack-md border-t border-outline-variant/20">
<a class="inline-flex items-center gap-2 font-label-md text-label-md text-primary hover:text-primary-container transition-colors font-bold group" href="/login">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
                    Voltar para o Login
                </a>
</div>
</div>
<!-- Footer (Subtle) -->
<footer class="mt-stack-xl text-center">
<p class="font-label-sm text-label-sm text-secondary-fixed-dim">
                © 2024 Economia com História – Angola. <br/>
                Todos os direitos reservados.
            </p>
</footer>
</main>
<!-- Visual Background Element (Subtle Pattern) -->
<div class="fixed inset-0 -z-10 opacity-5 pointer-events-none">
<div class="absolute top-0 left-0 w-full h-full" style="background-image: radial-gradient(#690008 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>
</div>
</body></html>
