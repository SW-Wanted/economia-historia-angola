<body class="bg-[#F2F2F0] min-h-screen flex flex-col items-center justify-center p-6 text-on-surface">
<div class="mb-stack-lg flex flex-col items-center text-center">
<h2 class="font-headline-md text-headline-md text-primary mb-2">Economia com História</h2>
<p class="font-label-md text-label-md text-secondary tracking-widest uppercase">Angola</p>
</div>
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] border border-outline-variant/30 overflow-hidden">
<div class="h-1.5 w-full bg-surface-container flex">
<div class="h-full w-1/3 bg-primary transition-all duration-500"></div>
</div>
<div class="p-margin-desktop md:p-stack-xl flex flex-col gap-stack-lg">
<header class="flex flex-col gap-stack-sm">
<span class="font-label-sm text-label-sm text-primary font-bold">Passo 1 de 3</span>
<h1 class="font-headline-lg text-headline-lg text-on-background">Criar Conta</h1>
<p class="font-body-md text-body-md text-secondary">Comece a sua jornada pela história económica de Angola registando os seus dados.</p>
</header>
<form class="flex flex-col gap-stack-md" onsubmit="return false;">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="full_name">Nome Completo</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-4 font-body-md focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" id="full_name" placeholder="Ex: Manuel dos Santos" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-4 font-body-md focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" id="email" placeholder="nome@exemplo.ao" type="email"/>
</div>
<div class="mt-stack-sm flex flex-col gap-stack-md">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full hover:bg-primary-container transition-colors active:scale-95 transform" type="submit">
                        Continuar
                    </button>
<button class="w-full flex items-center justify-center gap-stack-sm border border-outline-variant text-on-surface py-3.5 rounded-full font-label-md text-label-md hover:bg-surface-container-low transition-all" type="button">
<img alt="Google Logo" class="w-5 h-5" data-alt="The iconic Google multi-colored G logo rendered with high fidelity on a transparent background. The colors are vibrant and saturated, adhering to the official brand guidelines. The image is clean and minimalist, suitable for a professional authentication interface. It sits perfectly within a circular button frame." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCFfwS2b8e9vi7RxRWM_DG-Ng7tvYlexiGPuvXdjxNb_oU0y6ZGsdP_reD9FJBqhLbt_j4plChFTTQyp-wnoxnPT977oLN4ieTCflMsCSSra_uyckHivf0BEP6wkO7PaoJreZ2Mi7A-oy7S-dTFLc0ZscfnUDjnLXKPFx8eVXwK8_6G5_mupR_cPh3HpP3VSAzGCAA7CB_x9bz-H1-PphRC4RU-i-sACaIfHLkLFHat9EZIbwrkLZ8fnwB477mraGUbV6qLFqBIgRbf"/>
                        Registar com Google
                    </button>
</div>
</form>
<footer class="pt-stack-md border-t border-outline-variant text-center">
<p class="font-body-md text-body-md text-secondary">
                    Já tem conta? 
                    <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4" href="#">Iniciar Sessão</a>
</p>
</footer>
</div>
</main>
<div class="mt-stack-xl flex gap-stack-lg opacity-40 grayscale pointer-events-none hidden md:flex">
<div class="w-24 h-24 rounded-lg bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-4xl">history_edu</span>
</div>
<div class="w-24 h-24 rounded-lg bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-4xl">account_balance</span>
</div>
<div class="w-24 h-24 rounded-lg bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-4xl">insights</span>
</div>
</div>
</body></html>
