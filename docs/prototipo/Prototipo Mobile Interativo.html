document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<\u002Fspan><\u002Fdiv>\n                <div style=\"flex:1\"><div style=\"display:flex;align-items:center;gap:6px\"><span style=\"font-family:'Plus Jakarta Sans';font-weight:700;font-size:14px\">{{ n.title }}<\u002Fspan><span style=\"width:7px;height:7px;border-radius:50%;background:#8B1A1A;display:{{ n.dot }}\"><\u002Fspan><\u002Fdiv><div style=\"margin-top:2px;font-size:13px;line-height:1.4;color:#58413F\">{{ n.body }}<\u002Fdiv><div style=\"margin-top:4px;font-size:11px;color:#8C716E\">{{ n.timeAgo }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===================== SETTINGS ===================== -->\n      <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;background:#F2F2F0;min-height:0\">\n          <div style=\"height:52px;flex:none\"><\u002Fdiv>\n          <div style=\"flex:none;display:flex;align-items:center;height:52px;padding:0 8px\">\n            <button onclick=\"{{ back }}\" style=\"width:48px;height:48px;border:none;background:transparent;cursor:pointer\"><span class=\"mi\" style=\"font-size:24px\">arrow_back<\u002Fspan><\u002Fbutton>\n            <div style=\"flex:1;text-align:center;font-family:'Plus Jakarta Sans';font-weight:800;font-size:18px;color:#8B1A1A;margin-right:48px\">Definições<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"eh-scroll\" style=\"flex:1;padding:16px 20px 40px\">\n            <div style=\"font-family:'Plus Jakarta Sans';font-weight:700;font-size:18px\">Conta<\u002Fdiv>\n            <div style=\"height:12px\"><\u002Fdiv>\n            <div onclick=\"{{ toast }}\" style=\"background:#fff;border:1px solid rgba(224,191,188,.45);border-radius:20px;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer\"><div style=\"width:40px;height:40px;border-radius:11px;background:rgba(139,26,26,.1);display:flex;align-items:center;justify-content:center\"><span class=\"mi\" style=\"font-size:22px;color:#8B1A1A\">password<\u002Fspan><\u002Fdiv><div style=\"flex:1\"><div style=\"font-family:'Plus Jakarta Sans';font-weight:700;font-size:15px\">Atualizar palavra-passe<\u002Fdiv><div style=\"font-size:12px;color:#5E5E5E\">Alterar a sua palavra-passe de acesso.<\u002Fdiv><\u002Fdiv><span class=\"mi\" style=\"font-size:22px;color:#8C716E\">chevron_right<\u002Fspan><\u002Fdiv>\n            <div style=\"height:24px\"><\u002Fdiv>\n            <div style=\"font-family:'Plus Jakarta Sans';font-weight:700;font-size:18px\">Preferências<\u002Fdiv>\n            <div style=\"height:12px\"><\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid rgba(224,191,188,.45);border-radius:20px;padding:4px 16px\">\n              <sc-for list=\"{{ prefToggles }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <div onclick=\"{{ t.onTap }}\" style=\"display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:{{ t.border }};cursor:pointer\">\n                  <span style=\"flex:1;font-size:14px\">{{ t.label }}<\u002Fspan>\n                  <span style=\"width:44px;height:26px;border-radius:99px;background:{{ t.track }};position:relative;transition:.2s;flex:none\"><span style=\"position:absolute;top:3px;left:{{ t.knob }};width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)\"><\u002Fspan><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"height:24px\"><\u002Fdiv>\n            <div style=\"font-family:'Plus Jakarta Sans';font-weight:700;font-size:18px\">Aparência<\u002Fdiv>\n            <div style=\"height:12px\"><\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid rgba(224,191,188,.45);border-radius:20px;padding:4px 16px\">\n              <div onclick=\"{{ toggleDark }}\" style=\"display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(224,191,188,.4);cursor:pointer\"><span style=\"flex:1;font-size:14px\">Modo escuro<\u002Fspan><span style=\"width:44px;height:26px;border-radius:99px;background:{{ darkTrack }};position:relative;transition:.2s;flex:none\"><span style=\"position:absolute;top:3px;left:{{ darkKnob }};width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n              <div onclick=\"{{ toast }}\" style=\"display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer\"><span class=\"mi\" style=\"font-size:20px;color:#8B1A1A\">language<\u002Fspan><span style=\"flex:1;font-size:14px\">Idioma<\u002Fspan><span style=\"font-size:13px;color:#5E5E5E\">Português<\u002Fspan><span class=\"mi\" style=\"font-size:22px;color:#8C716E\">chevron_right<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===================== MAP ===================== -->\n      <sc-if value=\"{{ isMap }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;background:#002336;min-height:0\">\n          <div style=\"height:52px;flex:none\"><\u002Fdiv>\n          <div style=\"flex:none;display:flex;align-items:center;height:52px;padding:0 8px\">\n            <button onclick=\"{{ back }}\" style=\"width:48px;height:48px;border:none;background:transparent;cursor:pointer;color:#fff\"><span class=\"mi\" style=\"font-size:24px\">arrow_back<\u002Fspan><\u002Fbutton>\n            <div style=\"flex:1;text-align:center;font-family:'Plus Jakarta Sans';font-weight:800;font-size:18px;color:#fff;margin-right:48px\">Mapa Interativo<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"eh-scroll\" style=\"flex:1;padding:8px 20px 40px\">\n            <div style=\"display:inline-block;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.14);color:#fff;font-size:10px;font-weight:800;letter-spacing:1px\">EXPLORAR · 18 PROVÍNCIAS<\u002Fdiv>\n            <div style=\"height:14px\"><\u002Fdiv>\n            <div style=\"position:relative;height:300px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center\">\n              <svg viewBox=\"0 0 100 100\" style=\"width:200px;height:250px\">\n                <polygon points=\"30,22 68,20 74,34 70,52 76,70 58,82 40,80 30,64 26,42\" fill=\"rgba(255,255,255,.9)\" stroke=\"#690008\" stroke-width=\"1.5\"><\u002Fpolygon>\n                <circle cx=\"45\" cy=\"42\" r=\"3.4\" fill=\"#8B1A1A\"><\u002Fcircle><circle cx=\"45\" cy=\"42\" r=\"1.5\" fill=\"#fff\"><\u002Fcircle>\n                <circle cx=\"60\" cy=\"58\" r=\"3.4\" fill=\"#8B1A1A\"><\u002Fcircle><circle cx=\"60\" cy=\"58\" r=\"1.5\" fill=\"#fff\"><\u002Fcircle>\n                <circle cx=\"52\" cy=\"30\" r=\"3.4\" fill=\"#8B1A1A\"><\u002Fcircle><circle cx=\"52\" cy=\"30\" r=\"1.5\" fill=\"#fff\"><\u002Fcircle>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"height:16px\"><\u002Fdiv>\n            <div style=\"color:#fff;font-family:'Plus Jakarta Sans';font-weight:700;font-size:17px\">Toque numa província<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13px;line-height:1.5;color:rgba(255,255,255,.7)\">Descubra indicadores económicos, história e conteúdos locais de cada região.<\u002Fdiv>\n            <div style=\"height:14px\"><\u002Fdiv>\n            <sc-for list=\"{{ provinces }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div onclick=\"{{ toast }}\" style=\"margin-bottom:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer\"><span class=\"mi\" style=\"font-size:22px;color:#F4B400\">place<\u002Fspan><div style=\"flex:1\"><div style=\"color:#fff;font-weight:700;font-size:14px\">{{ p.name }}<\u002Fdiv><div style=\"font-size:12px;color:rgba(255,255,255,.6)\">{{ p.note }}<\u002Fdiv><\u002Fdiv><span class=\"mi\" style=\"font-size:20px;color:rgba(255,255,255,.5)\">chevron_right<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===================== TAB SCREENS (dashboard/explore/forum/profile) ===================== -->\n      <sc-if value=\"{{ isTabScreen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;background:#fff;min-height:0\">\n          <div style=\"height:52px;flex:none\"><\u002Fdiv>\n\n          <!-- Top bar per tab -->\n          <div style=\"flex:none;position:relative;display:flex;align-items:center;height:52px;padding:0 8px;background:#fff\">\n            <div style=\"width:48px;display:flex;justify-content:center\">\n              <button onclick=\"{{ toggleMenu }}\" style=\"width:44px;height:44px;border:none;background:transparent;cursor:pointer;display:{{ menuBtnDisplay }}\"><span class=\"mi\" style=\"font-size:24px;color:#8B1A1A\">grid_view<\u002Fspan><\u002Fbutton>\n              <button onclick=\"{{ back }}\" style=\"width:44px;height:44px;border:none;background:transparent;cursor:pointer;display:{{ tabBackDisplay }}\"><span class=\"mi\" style=\"font-size:24px;color:#251817\">arrow_back<\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"flex:1;text-align:center;font-family:'Plus Jakarta Sans';font-weight:800;font-size:18px;color:#8B1A1A\">{{ tabTitle }}<\u002Fdiv>\n            <div style=\"width:48px;display:flex;justify-content:center\">\n              <button onclick=\"{{ goNotifications }}\" style=\"width:44px;height:44px;border:none;background:transparent;cursor:pointer;display:{{ bellDisplay }}\"><span class=\"mi\" style=\"font-size:24px;color:#251817\">notifications<\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"eh-scroll\" style=\"flex:1;padding-bottom:106px\">\n\n            <!-- DASHBOARD -->\n            <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n              <!-- greeting -->\n              <div style=\"padding:14px 16px 12px;display:flex;align-items:center;gap:12px\">\n                <div style=\"flex:1\">\n                  <div style=\"font-size:12px;font-weight:800;letter-spacing:.3px;color:#8B1A1A\">BOM DIA<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:6px;margin-top:2px\"><span style=\"font-family:'Plus Jakarta Sans';font-weight:800;font-size:26px;letter-spacing:-.5px\">Manuel<\u002Fspan><span style=\"font-size:22px\">👋<\u002Fspan><\u002Fdiv>\n                  <div style=\"margin-top:4px;font-size:14px;line-height:1.35;color:#5E5E5E\">O seu feed de História da Economia, feito a pensar em si.<\u002Fdiv>\n                <\u002Fdiv>\n                <div onclick=\"{{ goProfile }}\" style=\"padding:2.5px;border-radius:50%;border:1.6px solid rgba(139,26,26,.35);cursor:pointer\"><div style=\"width:48px;height:48px;border-radius:50%;background:#FFE9E6;display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans';font-weight:800;font-size:16px;color:#8B1A1A\">MK<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <!-- continue a aprender -->\n              <div style=\"padding:4px 16px 10px;display:flex;align-items:center;gap:8px\"><span class=\"mi\" style=\"font-size:18px;color:#8B1A1A\">school<\u002Fspan><span style=\"font-family:'Plus Jakarta Sans';font-weight:700;font-size:16px;color:#8B1A1A\">Continue a aprender<\u002Fspan><\u002Fdiv>\n              <div class=\"eh-scroll\" style=\"display:flex;gap:12px;padding:0 16px 4px;overflow-x:auto\">\n                <sc-for list=\"{{ continueReading }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <div onclick=\"{{ c.onTap }}\" style=\"width:268px;flex:none;background:#FFF0EF;border-radius:16px;padding:10px;display:flex;gap:12px;cursor:pointer\">\n                    <div style=\"width:56px;height:56px;flex:none;border-radius:12px;background:{{ c.cover }};display:flex;align-items:center;justify-content:center\"><span class=\"mi\" style=\"font-size:26px;color:rgba(255,255,255,.85)\">{{ c.icon }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center\">\n                      <div style=\"font-family:'Plus Jakarta Sans';font-weight:700;font-size:13.5px;line-height:1.2;max-height:34px;overflow:hidden\">{{ c.title }}<\u002Fdiv>\n                      <div style=\"margin-top:8px;height:6px;border-radius:99px;background:#F5DDDB;overflow:hidden\"><div style=\"height:100%;width:{{ c.progress }};background:#8B1A1A\"><\u002Fdiv><\u002Fdiv>\n                      <div style=\"margin-top:5px;display:flex;align-items:center;font-size:11.5px;font-weight:700;color:#8B1A1A\"><span>{{ c.percent }}% concluído<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span>Continuar<\u002Fspan><span class=\"mi\" style=\"font-size:13px\">arrow_forward<\u002Fspan><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <!-- weekly challenge -->\n              <div style=\"padding:8px 16px 4px\">\n                <div onclick=\"{{ quizStart }}\" style=\"position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#8B1A1A,#690008);padding:18px;box-shadow:0 10px 20px -6px rgba(139,26,26,.4);cursor:pointer\">\n                  <span class=\"mi\" style=\"position:absolute;right:-12px;top:-12px;font-size:120px;color:rgba(255,255,255,.1)\">emoji_objects<\u002Fspan>\n                  <div style=\"position:relative\">\n                    <span style=\"display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:rgba(244,180,0,.18);border:1px solid rgba(244,180,0,.45);color:#fff;font-size:11px;font-weight:800;letter-spacing:.6px\"><span class=\"mi\" style=\"font-size:15px;color:#F4B400\">emoji_objects<\u002Fspan>DESAFIO DA SEMANA<\u002Fspan>\n                    <div style=\"margin-top:12px;font-family:'Plus Jakarta Sans';font-weight:700;font-size:22px;color:#fff\">Quiz da Semana<\u002Fdiv>\n                    <div style=\"margin-top:6px;font-size:14px;line-height:1.35;color:rgba(255,255,255,.7)\">Teste os seus conhecimentos sobre o Café em Angola. São só 2 minutos!<\u002Fdiv>\n                    <div style=\"margin-top:14px;display:inline-flex;align-items:center;gap:6px;padding:12px 18px;border-radius:10px;background:#fff;color:#8B1A1A;font-weight:700;font-size:13px\"><span class=\"mi\" style=\"font-size:20px\">play_arrow<\u002Fspan>Começar agora<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:8px;background:#F2F2F0;margin-top:8px\"><\u002Fdiv>\n\n              <!-- feed -->\n              <sc-for list=\"{{ feed }}\" as=\"post\" hint-placeholder-count=\"4\">\n                <div>\n                  <!-- header -->\n                  <div style=\"padding:12px 14px 8px;display:flex;align-items:center;gap:11px\">\n                    <div style=\"width:42px;height:42px;flex:none;border-radius:50%;background:{{ post.avatarBg }};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:{{ post.avatarColor }}\"><span class=\"mi\" style=\"font-size:22px;display:{{ post.avatarIconDisplay }}\">groups<\u002Fspan><span style=\"display:{{ post.avatarTextDisplay }}\">{{ post.initials }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-family:'Plus Jakarta Sans';font-weight:700;font-size:15px;color:{{ post.identColor }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ post.identity }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#5E5E5E;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ post.subline }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span class=\"mi\" style=\"font-size:22px;color:#5E5E5E\">more_horiz<\u002Fspan>\n                  <\u002Fdiv>\n                  <!-- cover -->\n                  <div onclick=\"{{ post.onOpen }}\" style=\"position:relative;height:200px;background:{{ post.cover }};display:flex;align-items:center;justify-content:center;cursor:pointer\">\n                    <span class=\"mi\" style=\"font-size:88px;color:rgba(255,255,255,.16)\">{{ post.coverIcon }}<\u002Fspan>\n                    <div style=\"position:absolute;inset:0;display:{{ post.lockedDisplay }};flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);text-align:center;padding:0 24px\"><span class=\"mi\" style=\"font-size:34px;color:#fff\">lock<\u002Fspan><div style=\"margin-top:8px;font-weight:800;font-size:15px;color:#fff\">{{ post.lockTitle }}<\u002Fdiv><div style=\"margin-top:3px;font-size:12px;color:rgba(255,255,255,.85)\">{{ post.lockNote }}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                  <!-- body -->\n                  <div style=\"padding:12px 16px 4px\">\n                    <div style=\"display:flex;align-items:center;gap:5px\"><span class=\"mi fill\" style=\"font-size:13px;color:{{ post.reasonColor }}\">{{ post.reasonIcon }}<\u002Fspan><span style=\"font-size:11.5px;font-weight:800;letter-spacing:.2px;color:{{ post.reasonColor }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ post.reasonLabel }}<\u002Fspan><\u002Fdiv>\n                    <div onclick=\"{{ post.onOpen }}\" style=\"margin-top:8px;font-family:'Plus Jakarta Sans';font-weight:700;font-size:19px;line-height:1.25;cursor:pointer\">{{ post.title }}<\u002Fdiv>\n                    <div style=\"margin-top:6px;font-size:14px;line-height:1.45;color:#58413F\">{{ post.subtitle }}<\u002Fdiv>\n                    <div style=\"ma 100%;height:100px;padding:14px;border:1px solid #E0BFBC;border-radius:8px;background:#fff;font-family:'Lexend';font-size:14px;outline:none;resize:none\"><\u002Ftextarea>\n            <\u002Fdiv>\n\n            <div style=\"height:24px\"><\u002Fdiv>\n            <div style=\"font-family:'Plus Jakarta Sans';font-weight:700;font-size:15px;color:#8B1A1A;letter-spacing:.2px\">Sala de discussão<\u002Fdiv>\n            <div style=\"height:12px\"><\u002Fdiv>\n            <div onclick=\"{{ togglePubRoom }}\" style=\"background:#fff;border:1px solid rgba(224,191,188,.5);border-radius:16px;padding:14px 14px;display:flex;align-items:center;gap:12px;cursor:pointer\">\n              <div style=\"flex:1\"><div style=\"font-weight:600;font-size:14px\">Sala privada (turma)<\u002Fdiv><div style=\"margin-top:2px;font-size:12px;color:#5E5E5E\">{{ pubRoomSub }}<\u002Fdiv><\u002Fdiv>\n              <span style=\"width:44px;height:26px;border-radius:99px;background:{{ pubRoomTrack }};position:relative;flex:none;transition:.2s\"><span style=\"position:absolute;top:3px;left:{{ pubRoomKnob }};width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s\"><\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:16px\"><\u002Fdiv>\n            <div onclick=\"{{ togglePubJindungo }}\" style=\"background:#fff;border:1px solid rgba(224,191,188,.5);border-radius:16px;padding:14px 14px;display:flex;align-items:center;gap:12px;cursor:pointer\">\n              <div style=\"flex:1\"><div style=\"font-weight:600;font-size:14px\">Conteúdo com Jindungo (acesso restrito)<\u002Fdiv><div style=\"margin-top:2px;font-size:12px;color:#5E5E5E\">Requer permissão para aceder.<\u002Fdiv><\u002Fdiv>\n              <span style=\"width:44px;height:26px;border-radius:99px;background:{{ pubJinTrack }};position:relative;flex:none;transition:.2s\"><span style=\"position:absolute;top:3px;left:{{ pubJinKnob }};width:20px;height:20px;border-radius:50%;
