services:
  api:
    build:
      context: .
      target: deps
    command: sh -c "npx prisma generate && npx prisma db push && npm run prisma:seed && npm run start:dev"
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    profiles:
      - local-infra
    environment:
      POSTGRES_DB: economia_historia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d economia_historia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles:
      - local-infra
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-06-26T01-06-18Z
    profiles:
      - local-infra
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
